
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE MORE SCROLL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial;background:white}
img{user-select:none;-webkit-user-drag:none}
button,input{font:inherit}
button{cursor:pointer}
.page{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#fff}
.page.on{display:flex}
#welcome,#select{cursor:none}
#logoBox{width:min(46vw,560px);transition:transform .12s}
#logoBox img{width:100%}
#startHint{position:absolute;bottom:34px;color:#bbb;font-size:12px;letter-spacing:7px}
#cursorPhone{position:fixed;left:50%;top:50%;z-index:999;width:52px;height:86px;background:white;border:3px solid #111;border-radius:12px;transform:translate(-50%,-50%) rotate(-18deg);pointer-events:none}
#cursorPhone:after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;color:#ff5e8c;font-size:30px}
#glow{position:fixed;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#ff7ca744,transparent 70%);transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:998}
#select{flex-direction:column}
#select h1{position:absolute;top:9%;font-size:clamp(28px,3vw,48px)}
.people{display:flex;gap:min(12vw,140px)}
.person{display:flex;flex-direction:column;align-items:center}
.person img{width:min(28vw,270px);height:260px;object-fit:contain}
.person b{font-size:24px;letter-spacing:4px}
.person.scared img{animation:shake .12s infinite alternate}
.person.fade{opacity:0;transition:.3s}
@keyframes shake{to{transform:translateX(4px)}}
.heart{position:fixed;pointer-events:none;z-index:1000}
#namePage{flex-direction:column;gap:22px}
#namePage h1{font-size:clamp(28px,3vw,44px)}
#nameInput{width:min(420px,80vw);padding:16px;border:0;border-bottom:2px solid #111;text-align:center;font-size:24px;outline:none}
#go{padding:14px 38px;border:2px solid #111;border-radius:30px;background:white}
#main{overflow:hidden;background:#f4f4f4;justify-content:flex-start;align-items:flex-start}
#track{position:relative;flex:none;width:max-content;height:128vh;top:-12vh;will-change:transform}
#bg{display:block;height:128vh;width:auto;max-width:none}
#bedHotspot{position:absolute;left:5.4%;top:66.5%;width:8.2%;height:8.2%;z-index:25;cursor:pointer}
#ringFx{position:absolute;left:6.2%;top:64%;width:36px;height:36px;z-index:26;pointer-events:none;display:none}
.ringLine{position:absolute;inset:0;border:2px solid #ff5c87aa;border-radius:50%;animation:ringPulse 1s infinite}
.ringLine:nth-child(2){animation-delay:.22s}
.ringLine:nth-child(3){animation-delay:.44s}
@keyframes ringPulse{0%{transform:scale(.4);opacity:.9}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
#note{position:fixed;right:4.5%;top:15%;width:min(390px,34vw);padding:18px;background:white;border-radius:22px;display:flex;align-items:center;gap:15px;box-shadow:0 10px 30px #0002;opacity:0;transform:translateY(-12px);transition:.8s;pointer-events:none;z-index:50}
#note.show{opacity:1;transform:translateY(0)}
#noteIcon{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:14px;background:#ff6b95;color:white;font-size:25px}
#noteText small{display:block;color:#aaa;font-size:12px;letter-spacing:2px;margin-bottom:4px}
#noteText div{font-size:16px;line-height:1.4;color:#222}
.hint{position:absolute;display:none;font-size:11px;letter-spacing:6px;color:#ff4f7d73;cursor:pointer;z-index:35;animation:blink 1s infinite alternate}
@keyframes blink{to{opacity:.2}}
#phoneHint{left:6%;top:66.2%}
#sofaHint{right:2.2%;top:60.8%}
#sofaHotspot{position:absolute;right:1.6%;top:47.8%;width:18%;height:18%;z-index:31;display:none;cursor:pointer}
#walker{position:absolute;left:-340px;bottom:13.7%;height:38.5%;width:auto;z-index:22;display:none;pointer-events:none}

/* PHONE */
#phonePanel{position:fixed;left:12%;top:50%;width:290px;height:560px;z-index:100;opacity:0;visibility:hidden;pointer-events:none;transform:translate(-30px,-50%);transition:opacity .5s,transform .5s,visibility .5s}
#phonePanel.visible{opacity:1;visibility:visible;pointer-events:auto;transform:translate(0,-50%)}
#phonePanel .phone{position:relative;width:100%;height:100%;border:9px solid #222;border-radius:35px;background:white;box-shadow:0 18px 50px #0004;overflow:hidden}
#home{position:absolute;inset:0;z-index:10;background:linear-gradient(150deg,#fff0f5,#f7d8e5);text-align:center;padding:55px 18px 20px}
.clock{font-size:43px;font-weight:300;color:#333}
#home p{margin-top:12px;color:#555;font-size:14px;letter-spacing:3px}
.gridA{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:65px}
#phonePanel .app{width:48px;height:48px;display:grid;place-items:center;background:white;border:0;border-radius:13px;font-size:27px;font-style:normal;box-shadow:0 3px 9px #0001}
#phonePanel .app.a{background:linear-gradient(135deg,#fd9bbd,#f24f83);color:white}
#phonePanel .app.b{background:#222;color:white}
#hh{display:none}
#phonePanel .top{height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:19px;font-weight:bold;border-bottom:1px solid #eee}
#stat{font-size:14px;color:#ff5c8b}
#feed{height:calc(100% - 101px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;background:white}
.post{padding-bottom:15px;border-bottom:1px solid #eee}
.postHeader{display:flex;align-items:center;gap:9px;padding:12px 13px;font-size:12px;font-weight:bold}
.avatar{width:29px;height:29px;background:#ffc9da;border-radius:50%;display:grid;place-items:center}
.postImage{height:230px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:65px;cursor:pointer}
.postActions{display:flex;gap:13px;padding:10px 14px;align-items:center}
.likeButton{border:0;background:transparent;font-size:26px;line-height:1;color:#333;transition:transform .2s}
.likeButton.liked{color:#ff477c;transform:scale(1.22)}
.postLikes{font-size:12px;font-weight:bold;padding:0 14px}
.postCaption{font-size:12px;line-height:1.6;padding:7px 14px;color:#333}
.bigLike{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.15);color:#ff3c79;font-size:115px;pointer-events:none;z-index:5;animation:bigHeart .9s ease-out forwards}
@keyframes bigHeart{0%{transform:translate(-50%,-50%) scale(.15);opacity:0}32%{transform:translate(-50%,-50%) scale(1.5);opacity:1}60%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-90%) scale(1.7);opacity:0}}
.flyingHeart{position:absolute;pointer-events:none;z-index:6;color:#ff4f86;font-size:22px}
.rainPost{background:white;border-bottom:1px solid #eee;padding-bottom:13px}
.rainTitle{padding:12px 13px;font-weight:bold;font-size:13px}
.rainGame{position:relative;height:250px;overflow:hidden;background:linear-gradient(160deg,#ff94b8,#f64f91)}
.rainScore{position:absolute;left:12px;top:10px;font-size:14px;color:white;font-weight:bold;z-index:4}
.rainTip{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11px;color:white;pointer-events:none;z-index:4}
.rainHeart{position:absolute;top:-45px;background:transparent;border:0;color:white;font-size:29px;z-index:3;line-height:1;animation:fallDown linear forwards}
@keyframes fallDown{from{transform:translateY(-30px) rotate(-15deg)}to{transform:translateY(350px) rotate(25deg)}}
.rainStart{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 20px;white-space:nowrap;border:0;border-radius:20px;background:white;color:#ec4e86;font-weight:bold;font-size:12px;z-index:5}
.rainMessage{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:white;font-weight:bold;font-size:22px;pointer-events:none;z-index:4}
.rainEnd{padding:11px 13px;font-size:12px;text-align:center;color:#e04c81}
#phonePanel nav{position:absolute;bottom:0;left:0;height:52px;width:100%;display:flex;align-items:center;justify-content:space-around;background:white;border-top:1px solid #eee;font-size:24px}
@media(max-width:800px){#logoBox{width:78vw}.people{gap:20px}.person img{width:42vw;height:200px}.person b{font-size:18px}#note{width:75vw}#phonePanel{left:8%;width:230px;height:445px}#home{padding-top:38px}.clock{font-size:33px}.gridA{gap:5px;margin-top:45px}#phonePanel .app{width:40px;height:40px}.postImage{height:170px}}
</style>
</head>
<body>
<section id="welcome" class="page on">
 <div id="logoBox"><img src="welcome.png"></div>
 <div id="startHint">CLICK</div>
</section>
<section id="select" class="page">
 <h1>CHOOSE YOUR CHARACTER</h1>
 <div class="people">
  <div class="person" id="girl" data-gender="girl"><img src="girl_normal.png"><b>GIRL</b></div>
  <div class="person" id="boy" data-gender="boy"><img src="boy_normal.png"><b>BOY</b></div>
 </div>
</section>
<section id="namePage" class="page">
 <h1>WHAT'S YOUR NAME?</h1>
 <input id="nameInput" maxlength="20" placeholder="Your name">
 <button id="go">CONTINUE</button>
</section>
<section id="main" class="page">
 <div id="track">
  <img id="bg" src="background.png">
  <div id="bedHotspot"></div>
  <div id="ringFx"><span class="ringLine"></span><span class="ringLine"></span><span class="ringLine"></span></div>
  <div id="phoneHint" class="hint">CLICK</div>
  <img id="walker" alt="Character">
  <div id="sofaHint" class="hint">CLICK</div>
  <div id="sofaHotspot"></div>
 </div>
 <div id="note"><div id="noteIcon">♥</div><div id="noteText"></div></div>
 <div id="phonePanel">
  <div class="phone" id="phone">
   <div id="home">
    <div class="clock">10:24</div><p>Social Media</p>
    <div class="gridA">
     <button id="appA" class="app a" aria-label="Open Scrollgram">◎<img id="hh" alt=""></button>
     <button class="app b">♪</button><i class="app"></i><i class="app"></i>
    </div>
   </div>
   <div class="top">scrollgram <span id="stat">♥ 0</span></div>
   <div id="feed"></div>
   <nav><span>⌂</span><span>⌕</span><span>＋</span><span>♡</span><span>◉</span></nav>
  </div>
 </div>
</section>
<div id="cursorPhone"></div><div id="glow"></div>
<audio id="ding" src="notification.mp3" preload="auto"></audio>
<audio id="steps" src="walkingsound.mp3" preload="auto" loop></audio>

<script>
const $=id=>document.getElementById(id);
let page="welcome",selected="",playerName="",busy=false;
let states={girl:"normal",boy:"normal"};
let noteCount=0,noteLoop,phoneClicked=false,canScroll=false,satDown=false;
let scrollX=0,walkFrame=0,lastSwap=0,stopStepsTimer;
let totalLikes=0,postNumber=0,activeRain=null;

function show(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
 $(id).classList.add("on");page=id;
 const fake=["welcome","select"].includes(id);
 $("cursorPhone").style.display=fake?"block":"none";
 document.body.style.cursor=fake?"none":"default";
}
document.addEventListener("mousemove",e=>{
 $("cursorPhone").style.left=e.clientX+"px";
 $("cursorPhone").style.top=e.clientY+"px";
 $("glow").style.left=e.clientX+"px";
 $("glow").style.top=e.clientY+"px";
 if(page==="welcome"){
  $("logoBox").style.transform=`translate(${(e.clientX-innerWidth/2)/45}px,${(e.clientY-innerHeight/2)/35}px)`;
  const r=$("logoBox").getBoundingClientRect();
  $("glow").style.opacity=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom?1:0;
 }else if(page==="select"&&!busy){
  let hit=false;
  ["girl","boy"].forEach(id=>{
   const el=$(id),r=el.getBoundingClientRect();
   const d=Math.hypot(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height*.42);
   const mood=d<220?"scared":"normal";
   if(states[id]!==mood){
    states[id]=mood;
    el.querySelector("img").src=id+"_"+mood+".png";
    el.classList.toggle("scared",mood==="scared");
   }
   if(d<220)hit=true;
  });
  $("glow").style.opacity=hit?1:0;
 }else $("glow").style.opacity=0;
});
$("welcome").onclick=()=>show("select");

function explodeHearts(x,y){
 for(let i=0;i<160;i++){
  const h=document.createElement("span");
  h.className="heart";h.textContent="♥";
  h.style.left=x+"px";h.style.top=y+"px";
  h.style.fontSize=14+Math.random()*34+"px";
  h.style.color=["#ff174f","#ff4169","#ff7798","#ffabc0"][Math.random()*4|0];
  document.body.appendChild(h);
  const a=Math.random()*Math.PI*2,d=90+Math.random()*Math.max(innerWidth,innerHeight)*.7;
  const dx=Math.cos(a)*d,dy=Math.sin(a)*d;
  h.animate([
   {transform:"translate(-50%,-50%) scale(.25)",opacity:1},
   {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`,opacity:0}
  ],{duration:1100+Math.random()*900,fill:"forwards"}).onfinish=()=>h.remove();
 }
}
document.querySelectorAll(".person").forEach(card=>card.onclick=()=>{
 if(busy)return;
 busy=true;selected=card.dataset.gender;
 card.classList.remove("scared");
 card.querySelector("img").src=selected+"_skeleton.png";
 document.querySelectorAll(".person").forEach(p=>{if(p!==card)p.classList.add("fade")});
 const r=card.getBoundingClientRect();
 explodeHearts(r.left+r.width/2,r.top+r.height/2);
 setTimeout(()=>{show("namePage");$("nameInput").focus()},2100);
});

function enterRoom(){
 playerName=$("nameInput").value.trim();
 if(!playerName)return $("nameInput").focus();
 show("main");initRoom();
}
$("go").onclick=enterRoom;
$("nameInput").onkeydown=e=>{if(e.key==="Enter")enterRoom()};

function initRoom(){
 clearInterval(noteLoop);
 noteCount=0;phoneClicked=false;canScroll=false;satDown=false;scrollX=0;walkFrame=0;
 $("track").style.transform="translateX(0)";
 ["phoneHint","sofaHint","sofaHotspot","walker","ringFx"].forEach(id=>$(id).style.display="none");
 $("note").classList.remove("show");
 $("phonePanel").classList.remove("visible");
 setTimeout(()=>{
  if(phoneClicked||page!=="main")return;
  fireNotification();
  noteLoop=setInterval(fireNotification,2200);
 },900);
}
function fireNotification(){
 if(phoneClicked||page!=="main")return;
 noteCount++;
 const s=`${noteCount} new notification${noteCount>1?"s":""}`;
 const label=document.createElement("small");
 label.textContent="NOW";
 const message=document.createElement("div");
 message.textContent=playerName+", you have "+s+"!";
 $("noteText").replaceChildren(label,message);
 $("ding").currentTime=0;$("ding").play().catch(()=>{});
 $("note").classList.remove("show");
 void $("note").offsetWidth;
 $("note").classList.add("show");
 $("ringFx").style.display="block";
 if(noteCount>=3)$("phoneHint").style.display="block";
}
function startCharacter(){
 if(phoneClicked)return;
 phoneClicked=true;clearInterval(noteLoop);
 $("note").classList.remove("show");
 $("phoneHint").style.display="none";
 $("ringFx").style.display="none";
 const w=$("walker");
 w.style.display="block";w.style.transition="none";
 w.style.height="38.5%";w.style.bottom="13.7%";
 w.src=selected+"_walk1.png";
 w.style.left=selected==="girl"?"-500px":"-320px";
 const stop=$("track").scrollWidth*(selected==="girl"?.008:.03);
 requestAnimationFrame(()=>{
  w.style.transition="left 1.2s ease";
  w.style.left=stop+"px";
 });
 setTimeout(()=>{w.style.transition="none";w.src=selected+"_walk1.png";canScroll=true},1300);
}
$("bedHotspot").onclick=startCharacter;
$("phoneHint").onclick=startCharacter;

function moveScene(delta){
 if(!canScroll||satDown)return;
 const max=Math.max(0,$("track").scrollWidth-innerWidth),prev=scrollX;
 scrollX=Math.max(0,Math.min(max,scrollX+delta));
 if(scrollX===prev)return;
 $("track").style.transform=`translateX(${-scrollX}px)`;
 const p=max?scrollX/max:0;
 const start=$("track").scrollWidth*(selected==="girl"?.008:.03);
 const end=$("track").scrollWidth*.865;
 $("walker").style.left=start+(end-start)*p+"px";
 if(performance.now()-lastSwap>170){
  walkFrame=1-walkFrame;
  $("walker").src=selected+(walkFrame?"_walk.png":"_walk1.png");
  lastSwap=performance.now();
 }
 if($("steps").paused)$("steps").play().catch(()=>{});
 clearTimeout(stopStepsTimer);
 stopStepsTimer=setTimeout(()=>$("steps").pause(),150);
 $("sofaHint").style.display=p>.87?"block":"none";
 $("sofaHotspot").style.display=p>.87?"block":"none";
}
window.addEventListener("wheel",e=>{
 if(page!=="main")return;
 if(satDown&&e.target.closest("#phonePanel"))return;
 e.preventDefault();moveScene(e.deltaY);
},{passive:false});

/* SOFT FADE SITTING — NO SQUASHING */
function sitOnSofa(){
 if(satDown)return;
 satDown=true;
 canScroll=false;

 $("steps").pause();
 $("sofaHint").style.display="none";
 $("sofaHotspot").style.display="none";

 const w=$("walker");
 const girl=selected==="girl";

 // Keep exact approved position. Girl is now smaller.
 const image=girl?"girl_teen.png":"boy_teen.png";
 const height=girl?"31%":"32.5%";
 const left=$("track").scrollWidth*.907+"px";
 const bottom=girl?"23.8%":"22.2%";

 w.style.transition="none";
 w.style.transform="none";

 // Fade out standing image smoothly
 const fadeOut=w.animate([
  {opacity:1},
  {opacity:0}
 ],{
  duration:400,
  easing:"ease-in-out",
  fill:"forwards"
 });

 fadeOut.onfinish=()=>{
  fadeOut.cancel();

  w.style.opacity="0";
  w.src=image;
  w.style.height=height;
  w.style.width="auto";
  w.style.left=left;
  w.style.bottom=bottom;

  // Fade in sitting image at its exact position
  const fadeIn=w.animate([
   {opacity:0},
   {opacity:1}
  ],{
   duration:600,
   easing:"ease-in-out",
   fill:"forwards"
  });

  fadeIn.onfinish=()=>{
   w.style.opacity="1";
   fadeIn.cancel();
  };
 };

 // Phone enters gently
 setTimeout(()=>{
  $("phonePanel").classList.add("visible");
  $("home").style.display="block";
 },500);
}
$("sofaHotspot").onclick=sitOnSofa;
$("sofaHint").onclick=sitOnSofa;

/* SOCIAL FEED */
const posts=[
 ["daily.mood","☁️","#e3e8f0","Slow mornings, quiet moments."],
 ["little.traveler","🌴","#fbe5b4","Wish you were here!"],
 ["happy.days","🌷","#f8dce8","A little happiness every day."],
 ["night.walk","🌙","#d7d8e7","The city never sleeps."],
 ["coffee.time","☕","#eddfd3","Just one more coffee."],
 ["weekend.fun","🎧","#d9d7f5","My favorite playlist."],
 ["sweet.life","🍰","#ffebd9","Dessert first!"],
 ["sunset.club","🌅","#f8d7c9","Golden hour."]
];

function addLikes(n){
 totalLikes+=n;
 $("stat").textContent="♥ "+totalLikes;
}
function likeExplosion(container){
 const big=document.createElement("span");
 big.className="bigLike";big.textContent="♥";
 container.append(big);setTimeout(()=>big.remove(),950);
 for(let i=0;i<15;i++){
  const h=document.createElement("span");
  h.className="flyingHeart";h.textContent="♥";
  h.style.left="50%";h.style.top="50%";
  container.append(h);
  const x=(Math.random()-.5)*220,y=(Math.random()-.5)*200;
  h.animate([
   {transform:"translate(-50%,-50%) scale(.3)",opacity:1},
   {transform:`translate(${x}px,${y}px) scale(${.7+Math.random()*1.8})`,opacity:0}
  ],{duration:700+Math.random()*550,fill:"forwards"}).onfinish=()=>h.remove();
 }
}
function make(tag,cls,txt){
 const el=document.createElement(tag);
 if(cls)el.className=cls;
 if(txt!==undefined)el.textContent=txt;
 return el;
}
function createPost(){
 const p=posts[postNumber++%posts.length];
 const article=make("article","post");
 const header=make("div","postHeader");
 header.append(make("span","avatar","♥"),make("span","",p[0]));
 const photo=make("div","postImage",p[1]);
 photo.style.background=p[2];
 const actions=make("div","postActions");
 const like=make("button","likeButton","♡");
 like.setAttribute("aria-label","Like");
 actions.append(like,make("span","","♧"),make("span","","➤"));
 const countLabel=make("div","postLikes","0 likes");
 const caption=make("div","postCaption",p[0]+"  "+p[3]);
 let count=0;
 function giveLike(){
  count++;addLikes(1);
  like.classList.add("liked");like.textContent="♥";
  countLabel.textContent=count+" likes";
  likeExplosion(photo);
 }
 like.onclick=giveLike;
 photo.ondblclick=giveLike;
 article.append(header,photo,actions,countLabel,caption);
 return article;
}

/* HEART RAIN */
function createHeartRain(){
 const card=make("section","rainPost");
 const title=make("div","rainTitle","♥ HEART RAIN");
 const game=make("div","rainGame");
 const score=make("div","rainScore","♥ 0");
 const tip=make("div","rainTip","Catch the falling hearts!");
 const start=make("button","rainStart","PLAY HEART RAIN ♥");
 const message=make("div","rainMessage");
 const result=make("div","rainEnd","Collect hearts to earn likes!");
 game.append(score,tip,start,message);
 card.append(title,game,result);

 let points=0,timer,endTimer,running=false;
 function stop(){
  if(!running)return;
  running=false;
  clearInterval(timer);
  clearTimeout(endTimer);
  game.querySelectorAll(".rainHeart").forEach(h=>h.remove());
  message.textContent="+"+points+" ♥";
  result.textContent="You collected "+points+" likes!";
  start.textContent="PLAY AGAIN ♥";
  start.style.display="block";
  if(activeRain===stop)activeRain=null;
 }
 function drop(){
  if(!running)return;
  const h=make("button","rainHeart","♥");
  h.style.left=5+Math.random()*85+"%";
  h.style.fontSize=22+Math.random()*19+"px";
  const seconds=1.5+Math.random()*1.5;
  h.style.animationDuration=seconds+"s";
  game.append(h);
  h.onclick=()=>{
   if(!running)return;
   points++;addLikes(1);
   score.textContent="♥ "+points;
   const pop=make("span","","+1 ♥");
   pop.style.cssText="position:absolute;left:40%;top:35%;color:white;font-size:24px;font-weight:bold;pointer-events:none;z-index:7";
   game.append(pop);
   pop.animate([
    {transform:"translateY(0)",opacity:1},
    {transform:"translateY(-45px) scale(1.5)",opacity:0}
   ],{duration:500}).onfinish=()=>pop.remove();
   h.remove();
  };
  setTimeout(()=>h.remove(),seconds*1000+100);
 }
 start.onclick=()=>{
  if(activeRain&&activeRain!==stop)activeRain();
  activeRain=stop;
  running=true;points=0;
  message.textContent="";
  score.textContent="♥ 0";
  result.textContent="Catch as many as you can!";
  start.style.display="none";
  drop();
  timer=setInterval(drop,280);
  endTimer=setTimeout(stop,15000);
 };
 return card;
}

/* INFINITE POSTS */
function appendFeed(){
 const fragment=document.createDocumentFragment();
 for(let i=0;i<8;i++){
  if(postNumber>0&&postNumber%5===0){
   fragment.append(createHeartRain());
  }
  fragment.append(createPost());
 }
 $("feed").append(fragment);
}
$("feed").addEventListener("scroll",()=>{
 const f=$("feed");
 if(f.scrollTop+f.clientHeight>=f.scrollHeight-600){
  appendFeed();
 }
});
appendFeed();

$("appA").onclick=()=>{
 $("home").style.display="none";
 $("feed").scrollTop=0;
};
</script>
